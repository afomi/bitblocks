name: Rolling restart

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image_tag:
        required: false
        type: string
        default: 'latest'

jobs:
  restart:
    name: Rolling restart
    runs-on: ubuntu-latest
    concurrency: deploy-group
    # Above the migrate ceiling below, so a long migration ends in our own error, not a job kill.
    timeout-minutes: 150
    env:
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get instance IDs
        id: instances
        run: |
          INSTANCES=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=bitblocks,bitblocks-*" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          echo "ids=$INSTANCES" >> $GITHUB_OUTPUT
          echo "first=$(echo $INSTANCES | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Rolling restart
        run: |
          set -euo pipefail

          TG_ARN=$(aws elbv2 describe-target-groups --names bitblocks-tg \
            --query 'TargetGroups[0].TargetGroupArn' --output text)
          # Port the targets are registered on (the host port the container binds).
          # Read it from a live target so we deregister/register the exact same
          # tuple; fall back to the app port if the TG is momentarily empty.
          TG_PORT=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
            --query 'TargetHealthDescriptions[0].Target.Port' --output text)
          if [ -z "$TG_PORT" ] || [ "$TG_PORT" = "None" ]; then TG_PORT=8080; fi
          echo "Target group $TG_ARN on port $TG_PORT"

          # Send a shell command over SSM with an explicit executionTimeout.
          # --timeout-seconds is only SSM's delivery timeout; without
          # executionTimeout the AWS-RunShellScript default (3600s) kills the command.
          ssm_send() {
            local inst=$1 exec_timeout=$2 cmd=$3
            aws ssm send-command \
              --instance-ids "$inst" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 180 \
              --parameters "$(jq -nc --arg c "$cmd" --arg t "$exec_timeout" '{commands: [$c], executionTimeout: [$t]}')" \
              --query 'Command.CommandId' --output text
          }

          # Poll an SSM command until it reaches a terminal status, up to a ceiling.
          # `aws ssm wait command-executed` gives up after ~100s, which a long
          # migration (GIN index builds on transactions) outlives while still running.
          ssm_wait() {
            local cmd_id=$1 inst=$2 ceiling=$3 start=$SECONDS status
            while :; do
              status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$inst" \
                --query 'Status' --output text 2>/dev/null || echo Pending)
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              if (( SECONDS - start >= ceiling )); then status="StillRunning($status)"; break; fi
              sleep 15
            done
            echo "$status"
          }

          # If anything fails while an instance is drained, say so loudly: it is
          # out of rotation until the next successful rollout re-registers it.
          DRAINED=""
          trap 'if [ -n "$DRAINED" ]; then echo "::error::$DRAINED is DEREGISTERED from bitblocks-tg. Fix the failure, then re-run restart.yml to re-register it."; fi' EXIT

          ECR_REPO="${{ steps.ecr.outputs.registry }}/bitblocks"
          IMAGE_TAG="${{ inputs.image_tag || 'latest' }}"
          IMAGE="${ECR_REPO}:${IMAGE_TAG}"

          # One instance at a time: drain it out of the ALB, redeploy, wait until
          # it's healthy again, THEN re-register before moving on. With >=2
          # instances the ALB always has a healthy target, so there is no 502
          # window. NOTE: migrations run mid-rollout while old code still serves on
          # the other instance(s) — schema changes must be backward compatible
          # (expand/contract), never a breaking rename/drop in the same deploy.
          for INST in ${{ steps.instances.outputs.ids }}; do
            echo "==> Deploying $INST"

            echo "  Draining from load balancer..."
            aws elbv2 deregister-targets --target-group-arn "$TG_ARN" \
              --targets Id=$INST,Port=$TG_PORT
            aws elbv2 wait target-deregistered --target-group-arn "$TG_ARN" \
              --targets Id=$INST,Port=$TG_PORT

            echo "  Deploying container..."
            DRAINED=$INST
            ENCODED=$(base64 -w 0 < .github/scripts/deploy.sh)
            CMD_ID=$(ssm_send "$INST" 900 "echo $ENCODED | base64 -d | bash -s -- $IMAGE")
            STATUS=$(ssm_wait "$CMD_ID" "$INST" 960)
            if [ "$STATUS" != "Success" ]; then
              echo "  ERROR: Deploy on $INST ended with status $STATUS"
              aws ssm get-command-invocation \
                --command-id $CMD_ID --instance-id $INST \
                --query 'StandardErrorContent' --output text
              exit 1
            fi

            # Run migrations on the first instance only, while it is still drained
            # (deploy.sh has confirmed the new container is up; migrate is idempotent).
            if [ "$INST" = "${{ steps.instances.outputs.first }}" ]; then
              echo "  Running migrations..."
              # Index builds on transactions (29 GB+) have taken several minutes;
              # allow 2h, then fail loudly. A StillRunning status means the command
              # is STILL running on the instance; don't re-run until it finishes.
              MIG_ID=$(ssm_send "$INST" 7200 "docker exec bitblocks /app/bin/migrate 2>&1")
              echo "  SSM command $MIG_ID"
              MIG_STATUS=$(ssm_wait "$MIG_ID" "$INST" 7260)
              aws ssm get-command-invocation \
                --command-id $MIG_ID --instance-id $INST \
                --query 'StandardOutputContent' --output text
              if [ "$MIG_STATUS" != "Success" ]; then
                echo "  ERROR: Migration ended with status $MIG_STATUS"
                exit 1
              fi
              echo "  Migrations complete."
            fi

            # Put it back in rotation and block until the ALB's own health check
            # reports it healthy. This is the readiness gate that the old blind
            # `sleep 20` lacked — traffic only returns once the app passes checks.
            echo "  Re-registering and waiting for healthy..."
            aws elbv2 register-targets --target-group-arn "$TG_ARN" \
              --targets Id=$INST,Port=$TG_PORT
            aws elbv2 wait target-in-service --target-group-arn "$TG_ARN" \
              --targets Id=$INST,Port=$TG_PORT

            DRAINED=""
            echo "  $INST is live."
          done

          echo "==> Deploy complete."
