name: Deploy to AWS

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      # A push touching only these doesn't deploy (#93); any other file does.
      # Run the workflow by hand to ship a docs-only change.
      - "**.md"
      - "docs/**"
      - ".claude/**"
  workflow_dispatch:

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      AWS_REGION: us-east-1
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/bitblocks:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/bitblocks:latest
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/bitblocks:cache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/bitblocks:cache,mode=max

  deploy:
    name: Deploy
    needs: build
    uses: ./.github/workflows/restart.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
